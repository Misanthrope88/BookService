databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: mate-academy
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: create-users-roles-table
      author: mate-academy
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: users_roles
            columnNames: user_id, role_id
            constraintName: pk_users_roles
        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_roles_user
        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_roles_role
  - changeSet:
      id: insert-roles
      author: mate-academy
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: USER
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ADMIN
  - changeSet:
      id: assign-user-role-to-existing-users
      author: mate-academy
      changes:
        - sql:
            sql: >
              INSERT INTO users_roles (user_id, role_id)
              SELECT users.id, roles.id
              FROM users CROSS JOIN roles
              WHERE roles.name = 'USER'
  - changeSet:
      id: insert-admin-user
      author: mate-academy
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@bookstore.com
              - column:
                  name: password
                  value: '$2b$12$OxBzmzNisX7h.Me2av5HI.iEszTeuo1KnLE0zBQWJyIsl1Mz3JlS.'
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: User
  - changeSet:
      id: assign-admin-role
      author: mate-academy
      changes:
        - sql:
            sql: >
              INSERT INTO users_roles (user_id, role_id)
              SELECT users.id, roles.id
              FROM users CROSS JOIN roles
              WHERE users.email = 'admin@bookstore.com'
                AND roles.name = 'ADMIN'
