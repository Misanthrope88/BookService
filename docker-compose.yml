services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: ${MYSQLDB_USER:?Set MYSQLDB_USER in .env}
      MYSQL_PASSWORD: ${MYSQLDB_PASSWORD:?Set MYSQLDB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD:?Set MYSQLDB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQLDB_DATABASE:?Set MYSQLDB_DATABASE in .env}
    ports:
      - "127.0.0.1:${MYSQLDB_LOCAL_PORT:?Set MYSQLDB_LOCAL_PORT in .env}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQLDB_DATABASE:?Set MYSQLDB_DATABASE in .env}?sslMode=DISABLED&allowPublicKeyRetrieval=true
      MYSQLDB_USER: ${MYSQLDB_USER:?Set MYSQLDB_USER in .env}
      MYSQLDB_PASSWORD: ${MYSQLDB_PASSWORD:?Set MYSQLDB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "${SPRING_LOCAL_PORT:?Set SPRING_LOCAL_PORT in .env}:8080"

volumes:
  mysql-data:
