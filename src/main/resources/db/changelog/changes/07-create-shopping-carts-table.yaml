databaseChangeLog:
  - changeSet:
      id: create-shopping-carts-table
      author: mate-academy
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shopping_carts
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shopping_carts_user
  - changeSet:
      id: create-carts-for-existing-users
      author: mate-academy
      changes:
        - sql:
            sql: INSERT INTO shopping_carts (id) SELECT id FROM users
